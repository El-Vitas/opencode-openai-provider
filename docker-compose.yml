version: "3.8"

services:
  provider:
    build: .
    network_mode: "host"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - API_KEY=${API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-github-copilot/gpt-4o}
      # OpenCode server auth (if protected)
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
