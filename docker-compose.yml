version: "3.8"

services:
  provider:
    build: .
    network_mode: "host"
    environment:
      - HOST=0.0.0.0
      - PORT=4096
      - API_KEY=${API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai/gpt-4o}
      # OpenCode server auth (if protected)
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      # Optional: connect to external OpenCode server
      # - OPENCODE_BASE_URL=http://localhost:4096